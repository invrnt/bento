# DORMANT, manual-only. GitHub Actions has no billing for this repository, so this workflow no longer runs
# on pushes, pull requests, tags or schedules (it was a required check; see docs/dev/releasing.md#github-actions).
# The local gate scripts/local-ci.sh and the local release tool scripts/release/bento-release replace it.
# It is kept, unchanged apart from its triggers, so it can be re-enabled when billing returns: restore the
# `on:` block from git history (commit before "Local release process").
name: Android

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  ANDROID_NDK_VERSION: 27.1.12297006

defaults:
  run:
    working-directory: apps/android

jobs:
  wheels:
    name: Python wheels (Android cp313)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/android/python-wheels/dist
          key: android-wheels-${{ hashFiles('apps/android/python-wheels/*.sh', 'apps/android/python-wheels/*.py') }}
      - name: Build pydantic-core, cryptg, pyaes, hkdf
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" > /dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" python-wheels/build_all.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-wheels
          path: apps/android/python-wheels/dist

  checks:
    name: Lint, unit, screenshots, drift, assemble
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-wheels
          path: apps/android/python-wheels/dist
      - name: Build Python for Chaquopy
        run: echo "BUILD_PYTHON=$(uv python find --managed-python 3.13 || (uv python install 3.13 && uv python find 3.13))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/android/scripts/package-lock.json
      - name: Design-system generators (tests and drift)
        run: |
          npm ci --prefix scripts
          npm test --prefix scripts
          ./gradlew :core:designsystem:verifyBentoGenerated -PbentoBuildPython="$BUILD_PYTHON"
      - name: OpenAPI drift check
        run: ./gradlew :core:api:checkOpenApiDrift
      - name: Generator tests
        run: ./gradlew -p build-logic :convention:test && ./gradlew :core:designsystem-lint:test -PbentoBuildPython="$BUILD_PYTHON"
      - name: ktlint and detekt
        run: ./gradlew ktlintCheck detekt -PbentoBuildPython="$BUILD_PYTHON"
      - name: Unit tests and Roborazzi verification
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug -PbentoBuildPython="$BUILD_PYTHON"
      - name: Android lint
        run: ./gradlew lintDebug -PbentoBuildPython="$BUILD_PYTHON"
      - name: Assemble debug and release (unsigned), both ABIs
        run: ./gradlew :app:assembleDebug :app:assembleRelease -PbentoAbis=arm64-v8a,x86_64 -PbentoBuildPython="$BUILD_PYTHON"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports
            apps/android/**/build/outputs/roborazzi

  emulator:
    name: Emulator smoke (API ${{ matrix.api }})
    needs: wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-wheels
          path: apps/android/python-wheels/dist
      - run: echo "BUILD_PYTHON=$(uv python find --managed-python 3.13 || (uv python install 3.13 && uv python find 3.13))" >> "$GITHUB_ENV"
      - name: Instrumented smoke (engine, health, thumbnail bridge, UIDT, process death)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect
          working-directory: apps/android
          script: >-
            ./gradlew :app:connectedDebugAndroidTest :smoke:connectedCheck
            -Pandroid.testInstrumentationRunnerArguments.notClass=dev.bento.smoke.StartupBenchmark
            -PbentoBuildPython="$BUILD_PYTHON"
      - name: Macrobenchmark smoke (nightly)
        if: github.event_name == 'schedule' && matrix.api == 36
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect
          working-directory: apps/android
          script: >-
            ./gradlew :smoke:connectedCheck
            -Pandroid.testInstrumentationRunnerArguments.class=dev.bento.smoke.StartupBenchmark
            -PbentoBuildPython="$BUILD_PYTHON"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-instrumented-${{ matrix.api }}
          path: |
            apps/android/**/build/outputs/androidTest-results
            apps/android/**/build/outputs/connected_android_test_additional_output
