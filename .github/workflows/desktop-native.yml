name: Desktop native validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.id }} unsigned package
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-22.04
          - id: windows-x64
            runner: windows-2025
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache native sidecar build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
            ~/.cache/pyinstaller
            ~/Library/Application Support/pyinstaller
            ~/AppData/Local/uv/cache
            ~/AppData/Local/pyinstaller
          key: sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/api/uv.lock', 'apps/api/packaging/**', 'apps/api/src/**') }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Install Linux packaging and smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot xvfb
      - name: Install locked dependencies
        shell: bash
        run: |
          uv sync --project apps/api --frozen --extra dev --extra desktop
          npm --prefix apps/web ci
          npm --prefix apps/desktop ci
      - name: Test backend, web, and desktop
        shell: bash
        run: |
          (cd apps/api && uv run pytest)
          npm --prefix apps/web test
          npm --prefix apps/desktop test
      - name: Write desktop build configuration (public values only)
        # Unsigned validation builds never receive Telegram API credentials; Telegram sign-in reports it is unavailable.
        shell: bash
        env:
          BENTO_RELAY_URL: ${{ vars.BENTO_RELAY_URL }}
          BENTO_PUBLIC_SITE_URL: ${{ vars.BENTO_PUBLIC_SITE_URL }}
        run: node apps/desktop/scripts/write-build-config.mjs
      - name: Build native sidecar and makers
        run: npm --prefix apps/desktop run make
      - name: Smoke packaged application twice
        run: npm --prefix apps/desktop run smoke:packaged
      - name: Verify native maker outputs
        run: npm --prefix apps/desktop run verify:artifacts
      - name: Generate SBOM and checksums
        shell: bash
        env:
          BENTO_RELEASE_VERSION: ${{ github.sha }}
        run: |
          node apps/desktop/scripts/generate-sbom.mjs "dist/desktop/bento-${{ matrix.id }}.cdx.json"
          node apps/desktop/scripts/stage-artifacts.mjs "dist/desktop" "dist/release-${{ matrix.id }}"
          node apps/desktop/scripts/checksums.mjs "dist/release-${{ matrix.id }}" "SHA256SUMS-${{ matrix.id }}"
      - name: Upload unsigned native artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bento-${{ matrix.id }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: dist/release-${{ matrix.id }}/**
