name: Desktop signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-production-release
  cancel-in-progress: false

jobs:
  signing-gate:
    name: Require production signing credentials
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
      HAS_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
      HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      HAS_TELEGRAM_API_ID: ${{ secrets.BENTO_TELEGRAM_API_ID != '' }}
      HAS_TELEGRAM_API_HASH: ${{ secrets.BENTO_TELEGRAM_API_HASH != '' }}
    steps:
      - name: Check out source for version gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js 24 for version gate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Validate tag matches desktop package version
        run: node apps/desktop/scripts/validate-release-tag.mjs "${{ github.ref_name }}"
      - name: Require release commit from main
        shell: bash
        run: |
          git fetch --no-tags origin main
          release_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$release_commit" origin/main
      - name: Block unsigned production tags
        shell: bash
        run: |
          missing=0
          for present in "$HAS_APPLE_CERTIFICATE" "$HAS_APPLE_CERTIFICATE_PASSWORD" "$HAS_APPLE_SIGNING_IDENTITY" "$HAS_APPLE_ID" "$HAS_APPLE_APP_PASSWORD" "$HAS_APPLE_TEAM" "$HAS_WINDOWS_CERTIFICATE" "$HAS_WINDOWS_CERTIFICATE_PASSWORD"; do
            if [ "$present" != "true" ]; then missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production release blocked: Apple signing/notarization and Windows signing credentials are required."
            echo "Use Desktop native validation for explicitly unsigned test artifacts."
            exit 1
          fi
          if [ "$HAS_TELEGRAM_API_ID" != "true" ] || [ "$HAS_TELEGRAM_API_HASH" != "true" ]; then
            echo "Production release blocked: BENTO_TELEGRAM_API_ID and BENTO_TELEGRAM_API_HASH secrets are required."
            exit 1
          fi

  native-release:
    name: ${{ matrix.id }} signed release
    needs: signing-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
          - id: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
          - id: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - id: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache native sidecar build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
            ~/.cache/pyinstaller
            ~/Library/Application Support/pyinstaller
            ~/AppData/Local/uv/cache
            ~/AppData/Local/pyinstaller
          key: sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/api/uv.lock', 'apps/api/packaging/**', 'apps/api/src/**') }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Install Linux packaging and smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot xvfb
      - name: Install locked dependencies
        shell: bash
        run: |
          uv sync --project apps/api --frozen --extra dev --extra desktop
          npm --prefix apps/web ci
          npm --prefix apps/desktop ci
      - name: Test backend, web, and desktop
        shell: bash
        run: |
          (cd apps/api && uv run pytest)
          npm --prefix apps/web test
          npm --prefix apps/desktop test
      - name: Write desktop build configuration
        # Values are validated and written to a packaged resource; the script prints key names only.
        shell: bash
        env:
          BENTO_TELEGRAM_API_ID: ${{ secrets.BENTO_TELEGRAM_API_ID }}
          BENTO_TELEGRAM_API_HASH: ${{ secrets.BENTO_TELEGRAM_API_HASH }}
          BENTO_RELAY_URL: ${{ vars.BENTO_RELAY_URL }}
          BENTO_PUBLIC_SITE_URL: ${{ vars.BENTO_PUBLIC_SITE_URL }}
        run: node apps/desktop/scripts/write-build-config.mjs --require-telegram
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/bento-signing.keychain-db"
          certificate="$RUNNER_TEMP/bento-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          rm -f "$certificate"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "bento-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificate" >> $env:GITHUB_ENV
      - name: Build signed and notarized macOS makers
        if: runner.os == 'macOS'
        env:
          BENTO_MAC_SIGNING: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm --prefix apps/desktop run make
      - name: Build signed Windows makers
        if: runner.os == 'Windows'
        env:
          BENTO_WINDOWS_SIGNING: "1"
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm --prefix apps/desktop run make
      - name: Build Linux makers
        if: runner.os == 'Linux'
        run: npm --prefix apps/desktop run make
      - name: Smoke packaged application twice
        run: npm --prefix apps/desktop run smoke:packaged
      - name: Verify maker outputs
        run: npm --prefix apps/desktop run verify:artifacts
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find dist/desktop -type d -name Bento.app -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/desktop/make -Recurse -Filter "*.exe" | Where-Object Name -Match "Setup" | Select-Object -First 1
          if (-not $installer) { throw "Squirrel Setup.exe was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Invalid Windows signature: $($signature.Status)" }
      - name: Generate SBOM, updater manifest, and checksums
        shell: bash
        env:
          BENTO_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node apps/desktop/scripts/generate-sbom.mjs "dist/desktop/bento-${{ matrix.id }}.cdx.json"
          node apps/desktop/scripts/stage-artifacts.mjs "dist/desktop" "dist/release-${{ matrix.id }}"
          release_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          published_at="$(git show -s --format=%cI "$release_commit")"
          node apps/desktop/scripts/generate-update-manifest.mjs --stage "dist/release-${{ matrix.id }}" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --tag "$GITHUB_REF_NAME" --published-at "$published_at" --commit "$release_commit"
          node apps/desktop/scripts/checksums.mjs "dist/release-${{ matrix.id }}" "SHA256SUMS-${{ matrix.id }}"
      - name: Upload verified native release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bento-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30
          path: dist/release-${{ matrix.id }}/**

  publish:
    name: Attest and publish GitHub release
    needs: native-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bento-*
          path: release-artifacts
      - name: Collect unique flat release assets
        run: node apps/desktop/scripts/collect-release-assets.mjs release-artifacts release-assets
      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-assets/*
      - name: Publish immutable tag artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' artifacts < <(find release-assets -type f -print0)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Bento $GITHUB_REF_NAME"
          fi
          is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .draft)"
          if [ "$is_draft" = "true" ]; then
            gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" --clobber
          fi
          mapfile -t local_names < <(find release-assets -type f -printf '%f\n' | sort)
          mapfile -t remote_names < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[].name' | sort)
          if [ "${local_names[*]}" != "${remote_names[*]}" ]; then
            echo "Published release asset inventory does not match the verified local inventory."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            local_digest="sha256:$(sha256sum "$artifact" | cut -d ' ' -f 1)"
            remote_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq ".assets[] | select(.name == \"$name\") | .digest")"
            if [ "$local_digest" != "$remote_digest" ]; then
              echo "Release digest mismatch for $name."
              exit 1
            fi
          done
          if [ "$is_draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
