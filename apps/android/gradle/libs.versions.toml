# Every version is pinned. Toolchain pins come from the Stage 19 spike (docs/dev/android-spike.md);
# libraries are the latest stable releases at Stage 20 start (2026-11).
[versions]
# Toolchain (spike pins)
agp = "9.5.2"
kotlin = "2.4.21"
chaquopy = "17.2.0"
python = "3.13"
jdk = "17"
ndk = "27.1.12297006"
compileSdk = "37"
compileSdkMinor = "2"
targetSdk = "36"
minSdk = "29"

# Build plugins
ksp = "2.3.14"
hilt = "2.60.1"
roborazzi = "1.79.0"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
detekt = "2.0.0-alpha.6"
# Lint API for the design-system rules: AGP version + 23.
lint = "32.5.2"

# AndroidX
androidx-core = "1.19.1"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.1"
androidx-work = "2.12.0"
androidx-paging = "3.5.3"
androidx-navigation3 = "1.2.2"
androidx-datastore = "1.3.0"
androidx-splashscreen = "1.2.0"
androidx-hilt = "1.4.0"
androidx-exifinterface = "1.4.2"
androidx-tracing = "2.0.5"
androidx-profileinstaller = "1.4.1"
compose-bom = "2026.11.01"
compose-adaptive = "1.3.0"
compose-adaptive-navigation-suite = "1.5.0"
media3 = "1.11.1"

# Libraries
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
okhttp = "5.5.1"
coil = "3.6.3"
mlkit-text-recognition = "16.0.1"
# Onboarding/pairing QR scanner (agent 38): bundled on-device model, no Play services download.
camerax = "1.7.0"
mlkit-barcode-scanning = "17.3.0"
# Archivos › Escanear documento (agent 40): Play services document scanner, used only when available.
mlkit-document-scanner = "16.0.0"
# Viewer (agent 39): zoom/subsampling, foldable posture, in-app frame metrics.
telephoto = "0.19.0"
# In-app updater (agent 42a): Ed25519 verification on API 29-32 (no platform Ed25519 before API 33).
bouncycastle = "1.86"
androidx-window = "1.5.1"
androidx-metrics = "1.0.0"

# Tests
junit4 = "4.13.2"
robolectric = "4.18.1"
turbine = "1.2.1"
