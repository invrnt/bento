[project]
name = "bento-api"
version = "0.1.0"
description = "Bento local-first API and worker package."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=46,<47",
  "fastapi>=0.115,<0.116",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<0.1",
  "segno>=1.6,<2",
  "spake2>=0.9,<0.10",
  "sqlalchemy>=2.0,<3",
  "telethon>=1.45,<2",
  "uvicorn[standard]>=0.34,<0.35",
  "watchdog>=6,<7",
  "websockets>=15,<18",
]

[project.scripts]
bento-sidecar = "bento.interfaces.desktop.launcher:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
]
desktop = [
  "aiogram>=3,<4",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "onnxruntime>=1.18,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "pillow>=11,<12",
  "pyinstaller==6.22.2",
  "pypdfium2>=4.30,<5",
  "rapidocr>=3,<4",
]
media = [
  "pillow>=11,<12",
  "pypdfium2>=4.30,<5",
]
ocr = [
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "onnxruntime>=1.18,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "rapidocr>=3,<4",
]
telegram = [
  "aiogram>=3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bento"]

[tool.uv]
required-version = ">=0.11,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
